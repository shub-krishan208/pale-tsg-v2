services:
    gate:
        build:
            context: .
            dockerfile: backend/Dockerfile
        container_name: pale-gate-worker
        command: sh -c "python manage.py migrate && python manage.py sync_to_backend --loop & python manage.py runserver 0.0.0.0:8000"
        working_dir: /app/gate
        env_file:
            - .env
        expose:
            - "8000"
        environment:
            - TZ=Asia/Kolkata
            - DB_NAME=pale_gate_db
            - DB_USER=${DB_USER:-postgres}
            - DB_PASSWORD=${DB_PASSWORD:-postgres}
            - DB_HOST=postgres-gate
            - DB_PORT=5432
            - BACKEND_SYNC_URL=https://pale.devsociitkgp.com/api/sync/gate/events
            - SYNC_BATCH_SIZE=${SYNC_BATCH_SIZE:-500}
            - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-5}
            - SYNC_TIMEOUT_SECONDS=${SYNC_TIMEOUT_SECONDS:-10}
            - GATE_API_KEY=${GATE_API_KEY:-}
            - GATE_DEVICE_ID=${GATE_DEVICE_ID:-}
        volumes:
            - .:/app
        depends_on:
            postgres-gate:
                condition: service_healthy

    frontend:
        build:
            context: frontend
            dockerfile: Dockerfile
        container_name: pale-gate-frontend
        ports:
            - "3000:3000"
        environment:
            - NEXT_PUBLIC_BACKEND_URL=https://pale.devsociitkgp.com
            - NEXT_PUBLIC_ALL_GREEN=${ALL_GREEN:-false}
            - GATE_LOCAL_API_URL=http://pale-gate-worker:8000
        volumes:
            - ./gate/keys:/app/keys:ro
            - ./backend/keys:/app/backend/keys:ro
        depends_on:
            - gate

    serial-relay:
        build:
            context: .
            dockerfile: backend/Dockerfile
        container_name: pale-gate-serial-relay
        command: python scripts/gate_serial_relay.py
        working_dir: /app
        volumes:
            - .:/app
        privileged: true
        network_mode: "host"
        depends_on:
            - frontend

    postgres-gate:
        image: postgres:16
        container_name: pale-gate-db
        ports:
            - "54323:5432"
        environment:
            POSTGRES_DB: pale_gate_db
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
            TZ: Asia/Kolkata
        volumes:
            - postgres-gate-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d pale_gate_db"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres-gate-data:
